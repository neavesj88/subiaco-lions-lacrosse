<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      THE PAGE SHELL — client/index.html

      WHAT THIS IS: the empty page the browser loads first. The actual website
      is drawn into it by JavaScript. Think of it as the picture frame, not the
      picture.

      SHOULD A CLUB EDIT THIS FILE? No. Leave it alone.

      Your club's name, page titles, descriptions, address and contact details
      are filled in by the server from what you typed into Admin - Settings.
      That is why no club name is written here: putting one in would mean every
      club using this template published somebody else's details to Google.

      The two marker comments below (SEO-START / SEO-END, and RUNTIME-CONFIG)
      are not decoration. The server finds them by name and replaces them on
      every request. Delete or rename them and the site still loads, but every
      page shares one generic title, social links preview badly, and the admin
      panel cannot be opened.
    -->
    <!--SEO-START-->
    <title>Club website</title>
    <meta name="description" content="Loading the club website." />
    <!--SEO-END-->

    <!--RUNTIME-CONFIG-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- The site's typeface. display=swap means text shows immediately in a
         fallback font instead of being invisible while the font downloads —
         which matters most on a phone at a ground with one bar of signal. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Shown only when JavaScript is switched off or fails to load. Without
         this the visitor gets a blank white page and no idea why. -->
    <noscript>
      <div style="max-width:34rem;margin:4rem auto;padding:0 1.5rem;font-family:system-ui,sans-serif;line-height:1.6;color:#1c1917">
        <h1 style="font-size:1.5rem;margin:0 0 .75rem">This site needs JavaScript</h1>
        <p style="margin:0 0 1rem">
          Your browser has JavaScript turned off, so the club website cannot
          load. Turn it on in your browser settings and refresh the page.
        </p>
        <p style="margin:0">
          If you are trying to reach the club and cannot get this working, the
          club's contact details are on its social media pages.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
